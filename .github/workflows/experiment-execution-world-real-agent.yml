name: Execution World Real Agent Experiment

on:
  push:
    branches:
      - experiment/execution-world-real-agent
  pull_request:
    branches:
      - experiment/execution-world-placement
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 运行真实 Agent placement 测试
        run: pnpm exec vitest run packages/preset/agent-presets/tests/placement.spec.ts
      - name: 运行 agent-presets 完整测试
        run: pnpm exec vitest run packages/preset/agent-presets/tests
      - name: 运行 Host 类型与构建检查
        run: pnpm run build:lib:host
