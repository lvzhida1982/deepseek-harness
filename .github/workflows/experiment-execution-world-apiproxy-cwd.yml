name: Execution World ApiProxy Cwd Experiment

on:
  push:
    branches:
      - experiment/execution-world-apiproxy-cwd
  pull_request:
    branches:
      - experiment/execution-world-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apiproxy-cwd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 生成 ApiProxy 执行世界 cwd 实验实现
        run: node packages/host/apiproxy/tests/apply-execution-world-cwd-semantics.mjs
      - name: 运行 ApiProxy 执行世界 cwd 聚焦测试
        run: pnpm exec vitest run packages/host/apiproxy/tests/api-proxy-execution-world-cwd.spec.ts
      - name: 运行 ApiProxy 完整测试
        run: pnpm exec vitest run packages/host/apiproxy/tests
      - name: 运行 Web Preset 真实组合 E2E
        run: pnpm exec vitest run --config vitest.e2e.config.ts apps/cli/tests/web-agent-presets.e2e.ts
      - name: 运行 Host 类型与构建检查
        run: pnpm run build:lib:host
