name: Execution World ApiProxy Cwd Experiment

on:
  push:
    branches:
      - experiment/execution-world-apiproxy-cwd
  pull_request:
    branches:
      - experiment/execution-world-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apiproxy-cwd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 运行 ApiProxy 执行世界 cwd 红测试
        run: pnpm exec vitest run packages/host/apiproxy/tests/api-proxy-execution-world-cwd.spec.ts
