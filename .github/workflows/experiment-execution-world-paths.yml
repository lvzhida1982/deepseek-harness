name: Execution World Path Experiment

on:
  push:
    branches:
      - experiment/execution-world-paths
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 运行跨执行世界 cwd 红测试
        run: pnpm exec vitest run packages/core/session/tests/execution-world-cwd.spec.ts
