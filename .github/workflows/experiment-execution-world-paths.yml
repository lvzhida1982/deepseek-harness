name: Execution World Path Experiment

on:
  push:
    branches:
      - experiment/execution-world-paths
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 生成执行世界 cwd 实验实现
        run: node packages/core/session/tests/apply-execution-world-cwd.mjs
      - name: 运行 Session 与持久化测试
        run: pnpm exec vitest run packages/core/session/tests packages/session/session-persistence-jsonl/tests packages/session/session-persistence-sqlite/tests
      - name: 运行 Host 类型与构建检查
        run: pnpm run build:lib:host
      - name: 提交验证后的 Session cwd 实现
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- packages/core/session/src/index.ts; then
            echo '源码没有变化，无需提交'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/session/src/index.ts
          git commit -m '验证：提交通过完整测试的跨执行世界 cwd 实现'
          git push origin HEAD:${{ github.head_ref }}
