name: Execution World Agent Instructions Experiment

on:
  push:
    branches:
      - experiment/execution-world-agent-instructions
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent-instructions-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 生成文件系统执行世界路径语义原型
        run: node packages/context/agent-instructions/tests/apply-execution-world-path-semantics.mjs
      - name: 补齐 E2B 固定 POSIX 路径语义
        run: node packages/context/agent-instructions/tests/finalize-execution-world-path-semantics.mjs
      - name: 让指令插件完整调用链使用执行世界路径语义
        run: node packages/context/agent-instructions/tests/apply-agent-instructions-world-path-callers.mjs
      - name: 运行 Windows 执行世界指令发现测试
        run: pnpm exec vitest run packages/context/agent-instructions/tests/execution-world-paths.spec.ts
      - name: 运行 agent-instructions 完整测试
        run: pnpm exec vitest run packages/context/agent-instructions/tests
      - name: 运行 E2B 文件系统完整测试
        run: pnpm exec vitest run packages/e2b/fs-e2b/tests
      - name: 运行 Host 类型与构建检查
        run: pnpm run build:lib:host
      - name: 提交验证后的执行世界路径语义实现
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/fs/fs/src/index.ts \
            packages/e2b/fs-e2b/src/index.ts \
            packages/context/agent-instructions/src/files.ts \
            packages/context/agent-instructions/src/config.ts \
            packages/context/agent-instructions/src/index.ts \
            packages/context/agent-instructions/src/state.ts \
            packages/context/agent-instructions/src/render.ts \
            packages/context/agent-instructions/tests/execution-world-paths.spec.ts
          if git diff --cached --quiet; then
            echo '没有需要提交的生成源码'
            exit 0
          fi
          git commit -m '验证：提交通过完整测试的执行世界路径语义实现'
          git push origin HEAD:experiment/execution-world-agent-instructions
