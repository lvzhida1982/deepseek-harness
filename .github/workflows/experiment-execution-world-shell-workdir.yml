name: Execution World Shell Workdir Experiment

on:
  push:
    branches:
      - experiment/execution-world-shell-workdir
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-workdir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 生成 Bash 执行世界 workdir 实验实现
        run: node packages/shell/tool-bash/tests/apply-execution-world-workdir.mjs
      - name: 运行 tool-bash 完整测试
        run: pnpm exec vitest run packages/shell/tool-bash/tests
      - name: 运行 Host 类型与构建检查
        run: pnpm run build:lib:host
