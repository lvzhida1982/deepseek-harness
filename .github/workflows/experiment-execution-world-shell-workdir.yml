name: Execution World Shell Workdir Experiment

on:
  push:
    branches:
      - experiment/execution-world-shell-workdir
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shell-workdir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 生成 Bash 执行世界 workdir 实验实现
        run: node packages/shell/tool-bash/tests/apply-execution-world-workdir.mjs
      - name: 生成 PowerShell 执行世界 workdir 实验实现
        run: node packages/shell/tool-pwsh/tests/apply-execution-world-workdir.mjs
      - name: 运行 Bash 与 PowerShell 完整测试
        run: pnpm exec vitest run packages/shell/tool-bash/tests packages/shell/tool-pwsh/tests
      - name: 运行 Host 类型与构建检查
        run: pnpm run build:lib:host
      - name: 提交验证后的 Shell workdir 实现
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- packages/shell/tool-bash/src/index.ts packages/shell/tool-pwsh/src/index.ts; then
            echo '源码没有变化，无需提交'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/shell/tool-bash/src/index.ts packages/shell/tool-pwsh/src/index.ts
          git commit -m '验证：提交通过完整测试的 Shell 执行世界 workdir 实现'
          git push origin HEAD:${{ github.head_ref }}
