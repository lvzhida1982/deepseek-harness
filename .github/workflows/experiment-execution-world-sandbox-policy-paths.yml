name: Execution World Sandbox Policy Paths Experiment

# 实验阶段先由 CI 应用转换并完整验证；验证通过后只回写两份源码。
# workflow 与实验脚手架由连接器在源码落库后单独清理，避免 Actions
# 在同一个提交里修改自身导致权限或触发链干扰验证。
on:
  push:
    branches:
      - experiment/execution-world-sandbox-policy-paths
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sandbox-policy-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 生成 Sandbox Policy 跨执行世界路径实验实现
        run: node packages/sandbox/sandbox-policy/tests/apply-execution-world-path-semantics.mjs
      - name: 运行路径语义与本地安全聚焦测试
        run: pnpm exec vitest run packages/sandbox/sandbox-policy/tests/execution-world-path.spec.ts packages/sandbox/sandbox-local/tests/policy-root-ownership.spec.ts
      - name: 运行 Sandbox Policy 与 Local Sandbox 完整测试
        run: pnpm exec vitest run packages/sandbox/sandbox-policy/tests packages/sandbox/sandbox-local/tests
      - name: 运行受影响的 FS、Shell 与 Terminal 测试
        run: pnpm exec vitest run packages/fs/fs-sandbox/tests packages/shell/bash-sandbox/tests packages/shell/pwsh-sandbox/tests packages/shell/tool-bash/tests packages/shell/tool-pwsh/tests packages/terminal/terminal-bash/tests
      - name: 运行 Host 类型与构建检查
        run: pnpm run build:lib:host
      - name: 仅提交已验证的 Sandbox Policy 与 Local Sandbox 源码
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/sandbox/sandbox-policy/src/index.ts packages/sandbox/sandbox-local/src/index.ts
          git diff --cached --quiet || git commit -m '验证：提交通过完整测试的 Sandbox Policy 执行世界路径实现'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
