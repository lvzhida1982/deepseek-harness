name: Execution World Placement Experiment

on:
  push:
    branches:
      - experiment/execution-world-placement
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 应用通用挂载位置补丁
        run: git apply --check packages/preset/agent-presets/tests/generalized-placement.patch && git apply packages/preset/agent-presets/tests/generalized-placement.patch
      - name: 运行挂载位置与原有 Preset 测试
        run: pnpm exec vitest run packages/preset/agent-presets/tests/placement.spec.ts packages/preset/agent-presets/tests/mount.spec.ts
