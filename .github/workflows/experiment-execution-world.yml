name: Execution World Placement Experiment

on:
  push:
    branches:
      - experiment/execution-world-placement
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 生成通用挂载位置实验实现
        run: node packages/preset/agent-presets/tests/apply-generalized-placement.mjs
      - name: 运行 agent-presets 完整测试
        run: pnpm exec vitest run packages/preset/agent-presets/tests
      - name: 运行 Host 类型与构建检查
        run: pnpm run build:lib:host
      - name: 保存验证后的 AgentPresets 源码
        uses: actions/upload-artifact@v4
        with:
          name: agent-presets-placement-validated
          path: packages/preset/agent-presets/src/index.ts
          if-no-files-found: error
